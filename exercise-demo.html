<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movement demonstration</title>
<style>
:root{color-scheme:light;font:16px system-ui;color:#173749;background:#f3f8f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(100%,46rem);padding:10px 14px}h1{font-size:clamp(14px,2.5vw,21px);margin:0}svg{display:block;width:100%;height:clamp(106px,53vh,330px)}footer{display:flex;align-items:center;gap:.75rem}button{border:1px solid #466b74;color:inherit;background:white;border-radius:.45rem;padding:.45rem .85rem;font:inherit}output{font-size:clamp(12px,2vw,16px)}input{width:100%;accent-color:#087d79}
</style>
<main><h1 id="title">Movement demonstration</h1><svg viewBox="0 0 190 155" role="img" aria-labelledby="title step"></svg><footer><button id="play" type="button">Pause</button><output id="step"></output></footer><input id="position" type="range" min="0" max="1000" value="0" aria-label="Movement position"></main>
<script src="exercise-demo.js"></script></html>
